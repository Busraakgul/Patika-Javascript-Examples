<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f8ff;
    }

    h1 {
      color: #333;
    }

    input, button {
      padding: 10px;
      font-size: 1rem;
      margin: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #welcome {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #2c3e50;
    }

    #datetime {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #34495e;
    }
  </style>
</head>
<body>
  <h1>Hoş Geldiniz</h1>
  <p>Lütfen isminizi girin:</p>
  <input type="text" id="nameInput" placeholder="İsminizi yazın">
  <button id="submitButton">Gönder</button>

  <div id="welcome"></div>
  <div id="datetime"></div>

  <script>
    // HTML elemanlarını seç
    const nameInput = document.getElementById("nameInput");
    const submitButton = document.getElementById("submitButton");
    const welcomeDiv = document.getElementById("welcome");
    const datetimeDiv = document.getElementById("datetime");

    // Buton tıklandığında çalışacak fonksiyon
    submitButton.addEventListener("click", () => {
      const name = nameInput.value.trim(); // Kullanıcı adını al ve boşlukları temizle
      if (name) {
        welcomeDiv.textContent = `Hoş geldin, ${name}!`;
        updateDateTime();
      } else {
        welcomeDiv.textContent = "Lütfen isminizi girin.";
      }
    });

    // Tarih ve saati güncelleyen fonksiyon
    function updateDateTime() {
      const now = new Date();
      const days = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
      const day = days[now.getDay()];
      const time = now.toLocaleTimeString();
      datetimeDiv.textContent = `Bugün ${day}, saat ${time}`;
    }

    // Sayfa yüklendiğinde tarih ve saati güncel tut
    setInterval(updateDateTime, 1000); // Her saniye çalıştır
  </script>
</body>
</html>
